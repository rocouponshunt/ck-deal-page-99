<style>
@font-face{font-family:'Metropolis';src:url('https://asset22.ckassets.com/resources/image/staticpage_images/Metropolis-Regular-1706697147.otf') format('opentype');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Metropolis';src:url('https://asset22.ckassets.com/resources/image/staticpage_images/Metropolis-Medium-1706697129.otf') format('opentype');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Metropolis';src:url('https://asset22.ckassets.com/resources/image/staticpage_images/Metropolis-SemiBold-1706697165.otf') format('opentype');font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:'Metropolis';src:url('https://asset22.ckassets.com/resources/image/staticpage_images/Metropolis-Bold-1706697037.otf') format('opentype');font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'Metropolis';src:url('https://asset22.ckassets.com/resources/image/staticpage_images/Metropolis-ExtraBold-1706697055.otf') format('opentype');font-weight:800;font-style:normal;font-display:swap}
@font-face{font-family:'Metropolis';src:url('https://asset22.ckassets.com/resources/image/staticpage_images/Metropolis-Black-1706697003.otf') format('opentype');font-weight:900;font-style:normal;font-display:swap}

body,input,button{font-family:'Metropolis',sans-serif !important}

*{margin:0;padding:0;box-sizing:border-box}

/* ── VARIABLES ── */
.dh-root{
  --bg:#f5f5f7;--bg2:#fff;--bg3:#f0f0f4;--bg4:#e8e8ef;
  --border:#e0e0ea;--border2:#d0d0de;
  --accent:#5c2be2;--accent2:#7b52f0;--accent-light:#ede8fc;
  --orange:#ff6b2b;--green:#00a86b;--green-bg:#e6f7f1;
  --red:#e53e3e;--red-bg:#fef2f2;
  --text:#111118;--text2:#555566;--text3:#9898aa;
  --radius:16px;
  --card-w:200px;
  --shadow:0 2px 12px rgba(0,0,0,.07);
  --shadow-hover:0 8px 32px rgba(92,43,226,.13);
}

/* ── LOADER ── */
.dh-loader{position:fixed;inset:0;background:#fff;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.dh-loader-logo{font-size:28px;font-weight:800;letter-spacing:-1px;color:#111118}
.dh-loader-logo span{color:#5c2be2}
.dh-loader-bar{width:180px;height:3px;background:#f0f0f4;border-radius:2px;overflow:hidden}
.dh-loader-fill{height:100%;background:#5c2be2;border-radius:2px;animation:dhloadfill 1.2s ease-out forwards}
@keyframes dhloadfill{from{width:0}to{width:100%}}
.dh-loader-text{font-size:12px;color:#9898aa}

/* ── TOP NAV ── */
.dh-nav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.96);border-bottom:1px solid #e0e0ea;padding:0 16px}
.dh-nav-inner{max-width:1400px;margin:0 auto;height:56px;display:flex;align-items:center;gap:12px}
.dh-logo{font-size:20px;font-weight:800;letter-spacing:-.5px;flex-shrink:0;text-decoration:none;color:#111118;cursor:pointer}
.dh-logo span{color:#5c2be2}
.dh-search-wrap{flex:1;max-width:420px;position:relative}
.dh-search{width:100%;background:#f0f0f4;border:1.5px solid #e0e0ea;color:#111118;padding:9px 14px 9px 38px;border-radius:11px;font-family:'Metropolis',sans-serif;font-size:13px;outline:none}
.dh-search:focus{border-color:#5c2be2;background:#fff}
.dh-search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#9898aa;font-size:13px;pointer-events:none}
.dh-suggestions{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1.5px solid #e0e0ea;border-radius:13px;overflow:hidden;z-index:200;display:none;box-shadow:0 16px 40px rgba(0,0,0,.12)}
.dh-sug-item{display:flex;align-items:center;gap:10px;padding:10px 13px;cursor:pointer;border-bottom:1px solid #e0e0ea}
.dh-sug-item:last-child{border-bottom:none}
.dh-sug-img-wrap{width:38px;height:38px;border-radius:7px;overflow:hidden;background:#f0f0f4;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.dh-sug-img{width:100%;height:100%;object-fit:contain}
.dh-sug-info{flex:1;min-width:0}
.dh-sug-name{font-size:12px;font-weight:600;color:#111118;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dh-sug-price{font-size:11px;color:#555566;margin-top:1px}
.dh-sug-badge{background:#ede8fc;color:#5c2be2;font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap;flex-shrink:0}

/* ── CAT PILLS BAR ── */
.dh-catbar{background:#fff;border-bottom:1px solid #e0e0ea;padding:0 16px;position:sticky;top:56px;z-index:90;overflow:hidden}
.dh-catbar-inner{display:flex;align-items:center;gap:8px;height:46px;overflow-x:auto;scrollbar-width:none}
.dh-catbar-inner::-webkit-scrollbar{display:none}
.dh-cat-pill{flex-shrink:0;background:transparent;border:1.5px solid #e0e0ea;color:#555566;padding:4px 13px;border-radius:20px;cursor:pointer;font-family:'Metropolis',sans-serif;font-size:12px;font-weight:600;white-space:nowrap}
.dh-cat-pill.active{background:#5c2be2;border-color:#5c2be2;color:#fff}

/* ── SORT PILLS ── */
.dh-sort-bar{background:#fff;border-bottom:1px solid #e0e0ea;padding:0 16px;position:sticky;top:102px;z-index:89;overflow:hidden}
.dh-sort-inner{display:flex;align-items:center;gap:8px;height:40px;overflow-x:auto;scrollbar-width:none}
.dh-sort-inner::-webkit-scrollbar{display:none}
.dh-sort-label{font-size:11px;color:#9898aa;font-weight:600;flex-shrink:0}
.dh-sort-pill{flex-shrink:0;background:#f0f0f4;border:1.5px solid #e0e0ea;color:#555566;padding:3px 11px;border-radius:20px;cursor:pointer;font-family:'Metropolis',sans-serif;font-size:11px;font-weight:600;white-space:nowrap}
.dh-sort-pill.active{background:#5c2be2;border-color:#5c2be2;color:#fff}
.dh-sort-sep{width:1px;height:16px;background:#e0e0ea;flex-shrink:0}
.dh-price-filter{display:flex;align-items:center;gap:5px;flex-shrink:0}
.dh-price-lbl{font-size:11px;color:#9898aa;flex-shrink:0}
.dh-price-input{width:68px;background:#f0f0f4;border:1.5px solid #e0e0ea;color:#111118;padding:3px 7px;border-radius:8px;font-family:'Metropolis',sans-serif;font-size:11px;outline:none}
.dh-price-input:focus{border-color:#5c2be2}

/* ── PAGE BODY ── */
.dh-page-body{max-width:1400px;margin:0 auto;padding:20px 16px 60px;display:flex;gap:20px;align-items:flex-start}

/* ── SIDEBAR ── */
.dh-sidebar{width:210px;flex-shrink:0;position:sticky;top:156px;max-height:calc(100vh - 170px);overflow-y:auto;scrollbar-width:thin;scrollbar-color:#e0e0ea transparent}
.dh-sidebar::-webkit-scrollbar{width:4px}
.dh-sidebar::-webkit-scrollbar-thumb{background:#e0e0ea;border-radius:4px}
.dh-sidebar-box{background:#fff;border:1.5px solid #e0e0ea;border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.07)}
.dh-sidebar-title{font-size:12px;font-weight:700;color:#111118;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.dh-sidebar-clear{font-size:11px;color:#5c2be2;cursor:pointer;font-weight:600;display:none}
.dh-brand-search{width:100%;background:#f0f0f4;border:1.5px solid #e0e0ea;color:#111118;padding:6px 9px;border-radius:8px;font-family:'Metropolis',sans-serif;font-size:12px;outline:none;margin-bottom:8px}
.dh-brand-search:focus{border-color:#5c2be2}
.dh-brand-list{display:flex;flex-direction:column;gap:3px;max-height:260px;overflow-y:auto;scrollbar-width:thin}
.dh-brand-list::-webkit-scrollbar{width:3px}
.dh-brand-list::-webkit-scrollbar-thumb{background:#e0e0ea;border-radius:3px}
.dh-brand-item{display:flex;align-items:center;gap:8px;padding:5px 4px;cursor:pointer;border-radius:7px}
.dh-brand-cb{width:16px;height:16px;border:2px solid #d0d0de;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:transparent}
.dh-brand-cb.checked{background:#5c2be2;border-color:#5c2be2;color:#fff}
.dh-brand-name{font-size:12px;color:#555566;flex:1}
.dh-brand-count{font-size:10px;color:#9898aa;background:#f0f0f4;padding:1px 6px;border-radius:10px}

/* ── CONTENT AREA ── */
.dh-content-area{flex:1;min-width:0}
.dh-results-header{display:none;align-items:center;justify-content:space-between;margin-bottom:16px}
.dh-results-count{font-size:13px;color:#555566}
.dh-results-count strong{color:#111118;font-weight:600}

/* ── DEAL GRID ── */
.dh-deal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--card-w),1fr));gap:14px}

/* ── DEAL CARD ── */
.dh-deal-card{background:#fff;border:1.5px solid #e0e0ea;border-radius:16px;overflow:hidden;cursor:pointer;position:relative;display:flex;flex-direction:column;box-shadow:0 2px 12px rgba(0,0,0,.07)}
.dh-deal-card.oos{opacity:.55}
.dh-card-img-wrap{position:relative;aspect-ratio:1;background:#f0f0f4;overflow:hidden}
.dh-card-img{width:100%;height:100%;object-fit:contain;padding:10px;background:#fff}
.dh-card-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:36px;color:#9898aa;background:#f0f0f4}
.dh-card-disc-badge{position:absolute;top:8px;left:8px;background:#5c2be2;color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;z-index:2}
.dh-card-oos-overlay{position:absolute;inset:0;background:rgba(245,245,247,.8);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#555566}
.dh-card-viewing{position:absolute;bottom:7px;left:7px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;font-weight:500;padding:2px 7px;border-radius:20px;display:flex;align-items:center;gap:4px}
.dh-card-viewing-dot{width:5px;height:5px;border-radius:50%;background:#4ade80;animation:dhblink 1.4s infinite}
@keyframes dhblink{0%,100%{opacity:1}50%{opacity:.3}}
.dh-price-drop-ribbon{position:absolute;top:0;right:0;background:#e53e3e;color:#fff;font-size:9px;font-weight:700;padding:3px 8px;border-bottom-left-radius:8px;letter-spacing:.4px;z-index:3}
.dh-card-body{padding:11px;flex:1;display:flex;flex-direction:column;gap:3px}
.dh-card-retailer{font-size:10px;color:#9898aa;text-transform:uppercase;letter-spacing:.7px;font-weight:600}
.dh-card-name{font-size:12px;font-weight:600;line-height:1.4;color:#111118;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.dh-card-prices{display:flex;align-items:baseline;gap:6px;margin-top:4px}
.dh-card-mrp{text-decoration:line-through;font-size:11px;color:#9898aa}
.dh-card-price{font-size:18px;font-weight:800;color:#111118;letter-spacing:-.5px}
.dh-card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:6px;padding-top:7px;border-top:1px solid #e0e0ea}
.dh-card-timer{background:#fef2f2;border:1px solid #fecaca;border-radius:5px;padding:2px 7px}
.dh-card-timer-text{font-size:10px;font-weight:700;color:#e53e3e;font-family:'Metropolis',sans-serif}
.dh-type-badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600}
.dh-badge-cashback{background:#e6f7f1;color:#00a86b}
.dh-badge-rewards{background:#ede8fc;color:#5c2be2}

/* ── SKELETONS ── */
.dh-skel-card{background:#fff;border:1.5px solid #e0e0ea;border-radius:16px;overflow:hidden}
.dh-skel-img{aspect-ratio:1;background:#f0f0f4;animation:dhshimmer 1.5s infinite}
.dh-skel-body{padding:11px;display:flex;flex-direction:column;gap:8px}
.dh-skel-line{height:10px;border-radius:4px;background:#f0f0f4;animation:dhshimmer 1.5s infinite}
@keyframes dhshimmer{0%{opacity:1}50%{opacity:.5}100%{opacity:1}}

/* ── EMPTY ── */
.dh-empty{text-align:center;padding:60px 20px;color:#9898aa;grid-column:1/-1}
.dh-empty-icon{font-size:40px;margin-bottom:12px}
.dh-empty-title{font-size:15px;color:#555566;margin-bottom:6px;font-weight:600}

/* ── DETAIL PAGE ── */
.dh-detail-nav{background:rgba(255,255,255,.96);border-bottom:1px solid #e0e0ea;padding:0 16px;position:sticky;top:0;z-index:100}
.dh-detail-nav-inner{max-width:1200px;margin:0 auto;height:56px;display:flex;align-items:center;gap:14px}
.dh-back-btn{display:inline-flex;align-items:center;gap:6px;color:#555566;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid #e0e0ea;background:#fff;padding:6px 12px;border-radius:9px;font-family:'Metropolis',sans-serif}
.dh-detail-inner{max-width:1100px;margin:0 auto;padding:24px 16px 80px}
.dh-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
.dh-gallery{position:sticky;top:72px}
.dh-gallery-main{aspect-ratio:1;background:#fff;border:1.5px solid #e0e0ea;border-radius:16px;overflow:hidden;position:relative;margin-bottom:10px;box-shadow:0 2px 12px rgba(0,0,0,.07)}
.dh-gallery-main img{width:100%;height:100%;object-fit:contain;padding:16px;transition:opacity .3s}
.dh-gallery-main img.dh-fade{opacity:0}
.dh-gallery-count{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,.5);color:#fff;font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px}
.dh-gallery-viewing{position:absolute;bottom:10px;left:10px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;display:flex;align-items:center;gap:5px}
.dh-gallery-dot{width:6px;height:6px;border-radius:50%;background:#4ade80;animation:dhblink 1.4s infinite;flex-shrink:0}
.dh-thumbs{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.dh-thumbs::-webkit-scrollbar{display:none}
.dh-thumb{width:54px;height:54px;flex-shrink:0;border-radius:9px;overflow:hidden;border:2px solid #e0e0ea;cursor:pointer;background:#fff}
.dh-thumb.active{border-color:#5c2be2}
.dh-thumb img{width:100%;height:100%;object-fit:contain;padding:4px}

/* ── DETAIL INFO ── */
.dh-detail-info{display:flex;flex-direction:column;gap:16px}
.dh-detail-retailer-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dh-detail-retailer{font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:#9898aa;font-weight:600}
.dh-detail-cat-badge{font-size:11px;padding:3px 9px;border-radius:20px;background:#f0f0f4;border:1.5px solid #e0e0ea;color:#555566;font-weight:500}
.dh-detail-name{font-size:22px;font-weight:800;line-height:1.3;letter-spacing:-.4px;color:#111118}
.dh-detail-viewing{display:inline-flex;align-items:center;gap:6px;background:#e6f7f1;border:1px solid #bbf7d0;border-radius:20px;padding:4px 11px;font-size:12px;font-weight:600;color:#00a86b}
.dh-detail-viewing-dot{width:6px;height:6px;border-radius:50%;background:#00a86b;animation:dhblink 1.4s infinite}

/* ── PRICE BLOCK ── */
.dh-price-block{background:#fff;border:1.5px solid #e0e0ea;border-radius:14px;padding:18px;box-shadow:0 2px 12px rgba(0,0,0,.07)}
.dh-price-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.dh-detail-mrp{text-decoration:line-through;color:#9898aa;font-size:14px}
.dh-detail-price{font-size:32px;font-weight:800;color:#111118;letter-spacing:-1px}
.dh-detail-disc-badge{background:#5c2be2;color:#fff;padding:4px 11px;border-radius:7px;font-size:12px;font-weight:700}
.dh-detail-timer{display:inline-flex;align-items:center;gap:7px;background:#fef2f2;border:1.5px solid #fecaca;border-radius:9px;padding:7px 13px;margin-top:4px}
.dh-detail-timer-label{font-size:12px;color:#e53e3e;font-weight:500}
.dh-detail-timer-val{font-size:14px;font-weight:700;color:#e53e3e}
.dh-cb-line{font-size:13px;color:#555566;margin-top:4px}
.dh-cb-line strong{color:#00a86b;font-weight:700}

/* ── WATERFALL ── */
.dh-wf-toggle{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:10px 0 0;font-size:12px;color:#5c2be2;font-weight:600;border-top:1px solid #e0e0ea;margin-top:10px}
.dh-wf-body{display:none;margin-top:8px;background:#f0f0f4;border-radius:10px;padding:12px;font-size:12px}
.dh-wf-body.open{display:block}
.dh-wf-row{display:flex;justify-content:space-between;padding:3px 0;color:#555566}
.dh-wf-row.dh-wf-s .dh-wv{text-decoration:line-through;color:#9898aa}
.dh-wf-row.dh-wf-d .dh-wv{color:#00a86b;font-weight:600}
.dh-wf-row.dh-wf-a .dh-wv{color:#e53e3e}
.dh-wf-divider{border:none;border-top:1.5px solid #d0d0de;margin:9px 0;display:block;height:0}
.dh-wf-row.dh-wf-tot{color:#111118;font-weight:700}
.dh-wf-row.dh-wf-tot .dh-wv{color:#5c2be2;font-size:14px}
.dh-wf-row.dh-wf-sv{color:#00a86b;font-size:11px}

/* ── USER TABS (B1) ── */
.dh-user-tabs{display:flex;background:#f0f0f4;border:1.5px solid #e0e0ea;border-radius:11px;overflow:hidden;margin-bottom:4px}
.dh-user-tab{flex:1;background:none;border:none;padding:10px 8px;cursor:pointer;font-family:'Metropolis',sans-serif;font-size:12px;font-weight:600;color:#555566;text-align:center;line-height:1.4}
.dh-user-tab.active{background:#5c2be2;color:#fff}
.dh-utab-small{font-size:10px;opacity:.8;display:block}

/* ── CTA ── */
.dh-cta-btn{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;background:#5c2be2;color:#fff;border:none;padding:15px;border-radius:12px;font-family:'Metropolis',sans-serif;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;box-shadow:0 4px 16px rgba(92,43,226,.3)}
.dh-cta-sub{text-align:center;font-size:11px;color:#9898aa;margin-top:5px}
.dh-share-btn{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;background:#25d366;color:#fff;border:none;padding:10px 15px;border-radius:10px;font-family:'Metropolis',sans-serif;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none}

/* ── CASHBACK CHIPS ── */
.dh-cb-chips{display:flex;gap:12px;justify-content:center;margin-bottom:10px}
.dh-cb-chip{flex:1;background:#ede8fc;border:1.5px solid rgba(92,43,226,.15);border-radius:14px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;max-width:150px}
.dh-cb-chip-label{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:#5c2be2;font-weight:700}
.dh-cb-chip-val{font-size:24px;font-weight:800;color:#5c2be2;line-height:1}
.dh-cb-chip-unit{font-size:11px;color:#555566;font-weight:500}
.dh-cb-chip.dh-green{background:#e6f7f1;border-color:rgba(0,168,107,.15)}
.dh-cb-chip.dh-green .dh-cb-chip-label{color:#00a86b}
.dh-cb-chip.dh-green .dh-cb-chip-val{color:#00a86b}

/* ── RATES DIV TABLE ── */
.dh-rates-head{display:flex;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#9898aa;padding:7px 10px;border-bottom:1px solid #e0e0ea;font-weight:600}
.dh-rates-row{display:flex;padding:7px 10px;border-bottom:1px solid #e0e0ea;font-size:12px;color:#555566}
.dh-rates-col1{flex:1}
.dh-rates-col2{font-weight:600;color:#111118}

/* ── TABS SECTION ── */
.dh-tabs-wrap{background:#fff;border:1.5px solid #e0e0ea;border-radius:13px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.07)}
.dh-tab-list{display:flex;border-bottom:1px solid #e0e0ea}
.dh-tab-btn{flex:1;background:none;border:none;border-bottom:2px solid transparent;color:#555566;padding:12px 8px;cursor:pointer;font-family:'Metropolis',sans-serif;font-size:12px;font-weight:600;margin-bottom:-1px;text-align:center}
.dh-tab-btn.active{color:#5c2be2;border-bottom-color:#5c2be2;background:#ede8fc}
.dh-tab-content{padding:16px;display:none;font-size:13px;line-height:1.8;color:#555566}
.dh-tab-content.active{display:block}

/* ── SIMILAR GRID ── */
.dh-similar-section{margin-top:40px}
.dh-similar-title{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:10px;color:#111118}
.dh-similar-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}

/* ── FLOATING CTA (mobile) ── */

<script>
const GS_DEALS_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vSVZaZoYhwPwGtSvqR85X2_s8arib9L2ca7GxJp31OHOcykNKIPWhaShdhq_SNbIPW4020SF2WPvagn/pub?output=csv';
let DH_ALL=[],DH_TIMER=12,DH_ROT_MS=2000,DH_CAT_ORDER=[];
let DH_TRACKING_TPL='{linkurl}&source=TEST{random10}&p5={userid}&url={product_url}';
const DH_FIXED_UID='17861557';
let dhActiveCat='all',dhActiveSort='order',dhSelectedBrands=new Set();
let dhPriceMin=null,dhPriceMax=null,dhSearchQuery='';
let dhAllIntervals=[];
let dhPendingId=null;

const dhFmt=n=>Number(n||0).toLocaleString('en-IN');

function dhParseArr(v){
  if(!v)return[];
  if(Array.isArray(v))return v;
  try{const p=JSON.parse(v);return Array.isArray(p)?p:[];}catch(e){return[];}
}

function dhGetImages(deal){
  const urls=dhParseArr(deal.image_urls);
  const order=dhParseArr(deal.image_order);
  const hidden=dhParseArr(deal.hidden_images);
  const idx=order.length>0?order:urls.map((_,i)=>i);
  return idx.filter(i=>!hidden.includes(i)&&urls[i]).map(i=>urls[i]);
}

function dhViewingCount(id){
  let h=0;for(let i=0;i<(id||'').length;i++)h=(h*31+id.charCodeAt(i))&0xfffffff;
  return 12+(h%180)+Math.floor(Math.random()*6);
}

function dhTimeLeft(hours,withSecs){
  const h=hours||DH_TIMER||12;
  const now=new Date(),ds=new Date(now);ds.setHours(0,0,0,0);
  const msLeft=(h*3600000)-((now-ds)%(h*3600000));
  const hL=Math.floor(msLeft/3600000),mL=Math.floor((msLeft%3600000)/60000),sL=Math.floor((msLeft%60000)/1000);
  return withSecs?`${String(hL).padStart(2,'0')}:${String(mL).padStart(2,'0')}:${String(sL).padStart(2,'0')}`:`${hL}h ${mL}m`;
}

function dhBuildTrackingUrl(linkurl,productUrl){
  const r=Math.floor(1000000000+Math.random()*9000000000).toString();
  return DH_TRACKING_TPL.replace('{linkurl}',linkurl||'#').replace('{random10}',r).replace('{userid}',DH_FIXED_UID).replace('{product_url}',encodeURIComponent(productUrl||''));
}

/* ── CSV PARSER ── */
function dhParseCSV(text){
  const lines=text.trim().split('\n');
  if(lines.length<2)return[];
  const headers=lines[0].split(',').map(h=>h.trim().replace(/^"|"$/g,''));
  return lines.slice(1).map(line=>{
    const cols=[];
    let cur='',inQ=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch==='"'&&!inQ&&(i===0||line[i-1]===',')){inQ=true;}
      else if(ch==='"'&&inQ&&(i+1>=line.length||line[i+1]===',')){inQ=false;}
      else if(ch===','&&!inQ){cols.push(cur);cur='';}
      else{cur+=ch;}
    }
    cols.push(cur);
    const row={};
    headers.forEach((h,i)=>{
      let val=(cols[i]||'').trim().replace(/^"|"$/g,'');
      row[h]=val;
    });
    return row;
  });
}

function dhCoerceRow(r){
  /* Convert string values from CSV to correct types */
  const nums=['mrp','discounted_price','final_deal_price','discount_percent',
    'deal_order','timer_hours','shipping_fee','coupon_discount',
    'prepaid_discount_override','cashback_override','expected_confirmation_days',
    'b1_new_cashback','b1_existing_cashback'];
  const bools=['hidden','availability','price_dropped'];
  nums.forEach(k=>{if(r[k]!==undefined&&r[k]!=='')r[k]=parseFloat(r[k])||0;});
  bools.forEach(k=>{if(r[k]!==undefined)r[k]=String(r[k]).toLowerCase()==='true';});
  /* status: sheet stores 'live' or 'TRUE'/'true' */
  if(r.status!==undefined){
    const s=String(r.status).toLowerCase();
    r.status=(s==='live'||s==='true')?'live':s;
  }
  /* image_urls: parse JSON array or single URL */
  r.image_urls=dhParseArr(r.image_urls);
  r.image_order=dhParseArr(r.image_order||'[]');
  r.hidden_images=dhParseArr(r.hidden_images||'[]');
  r.retailer_rates=dhParseArr(r.retailer_rates||'[]');
  /* ck_admin_stores shim — code expects deal.ck_admin_stores for store fields */
  r.ck_admin_stores={
    store_type:r.store_type||'Cashback',
    cashback:parseFloat(r.cashback_override)||0,
    cashback_type:r.cashback_type||'percent',
    cashback_tc:r.cashback_tc||'',
    tracking_speed:r.tracking_speed||'—',
    expected_confirmation_days:r.expected_confirmation_days||'—',
    shipping_fee:parseFloat(r.shipping_fee)||0,
    shipping_rule:r.shipping_rule||'yes',
    linkurl:r.linkurl||'#',
    groupid:r.groupid||'A'
  };
  return r;
}

/* ── FETCH FROM GOOGLE SHEETS CSV ── */
async function dhFetch(){
  const ctrl=new AbortController();
  const fetchTimer=setTimeout(()=>ctrl.abort(),10000);
  try{
    const res=await fetch(GS_DEALS_URL,{signal:ctrl.signal});
    clearTimeout(fetchTimer);
    const text=await res.text();
    const rows=dhParseCSV(text);
    DH_ALL=rows
      .map(dhCoerceRow)
      .filter(d=>(d.status==='live'||d.status===true)&&d.hidden!==true);
    /* derive category order from deal_order sorted unique categories */
    const catMap={};
    DH_ALL.forEach(d=>{
      if(d.category&&!(d.category in catMap))catMap[d.category]=d.deal_order||999;
    });
    DH_CAT_ORDER=Object.entries(catMap).sort((a,b)=>a[1]-b[1]).map(e=>e[0]);
    document.documentElement.style.setProperty('--mobile-cols',2);
  }catch(fe){
    clearTimeout(fetchTimer);
    console.error('Google Sheets fetch failed:',fe);
  }
}

/* ── SIDEBAR ── */
function dhBuildSidebar(){
  const allCats=[...new Set(DH_ALL.map(d=>d.category).filter(Boolean))];
  const orderedCats=[...DH_CAT_ORDER.filter(c=>allCats.includes(c)),...allCats.filter(c=>!DH_CAT_ORDER.includes(c)).sort()];
  const bar=document.getElementById('dhCatBar');
  bar.querySelectorAll('.dh-cat-pill:not([data-cat="all"])').forEach(p=>p.remove());
  orderedCats.forEach(cat=>{
    const p=document.createElement('div');
    p.className='dh-cat-pill';p.dataset.cat=cat;p.textContent=cat;
    p.onclick=()=>dhSetCat(cat);
    bar.appendChild(p);
  });
  dhRenderBrandList('');
  document.getElementById('dhBrandSearch').addEventListener('input',function(){dhRenderBrandList(this.value.trim().toLowerCase());});
}

function dhGetBrandCounts(){
  const c={};DH_ALL.forEach(d=>{if(d.report_storename)c[d.report_storename]=(c[d.report_storename]||0)+1;});return c;
}

function dhRenderBrandList(query){
  const counts=dhGetBrandCounts();
  const brands=Object.entries(counts).filter(([b])=>!query||b.toLowerCase().includes(query)).sort((a,b)=>b[1]-a[1]);
  const el=document.getElementById('dhBrandList');el.innerHTML='';
  brands.forEach(([brand,count])=>{
    const item=document.createElement('div');item.className='dh-brand-item';
    const checked=dhSelectedBrands.has(brand);
    item.innerHTML=`<div class="dh-brand-cb${checked?' checked':''}">${checked?'✓':''}</div><span class="dh-brand-name">${brand}</span><span class="dh-brand-count">${count}</span>`;
    item.onclick=()=>dhToggleBrand(brand);
    el.appendChild(item);
  });
}

function dhToggleBrand(brand){
  if(dhSelectedBrands.has(brand))dhSelectedBrands.delete(brand);else dhSelectedBrands.add(brand);
  document.getElementById('dhClearBrands').style.display=dhSelectedBrands.size>0?'block':'none';
  dhRenderBrandList(document.getElementById('dhBrandSearch').value.trim().toLowerCase());
  dhRenderDeals();
}
function dhClearBrands(){
  dhSelectedBrands.clear();
  document.getElementById('dhClearBrands').style.display='none';
  dhRenderBrandList('');dhRenderDeals();
}
function dhSetCat(cat){
  dhActiveCat=cat;
  document.querySelectorAll('.dh-cat-pill').forEach(p=>p.classList.toggle('active',p.dataset.cat===cat));
  dhRenderDeals();
}
function dhSetSort(sort){
  dhActiveSort=sort;
  document.querySelectorAll('.dh-sort-pill').forEach(p=>p.classList.toggle('active',p.dataset.sort===sort));
  dhRenderDeals();
}

/* ── FILTER + SORT ── */
function dhGetFiltered(){
  let deals=[...DH_ALL];
  if(dhActiveCat!=='all')deals=deals.filter(d=>d.category===dhActiveCat);
  if(dhSelectedBrands.size>0)deals=deals.filter(d=>dhSelectedBrands.has(d.report_storename));
  if(dhPriceMin)deals=deals.filter(d=>d.final_deal_price>=dhPriceMin);
  if(dhPriceMax)deals=deals.filter(d=>d.final_deal_price<=dhPriceMax);
  if(dhSearchQuery){const q=dhSearchQuery.toLowerCase();deals=deals.filter(d=>(d.product_name||'').toLowerCase().includes(q)||(d.category||'').toLowerCase().includes(q)||(d.report_storename||'').toLowerCase().includes(q));}
  if(dhActiveSort==='discount')deals.sort((a,b)=>b.discount_percent-a.discount_percent);
  else if(dhActiveSort==='price_asc')deals.sort((a,b)=>a.final_deal_price-b.final_deal_price);
  else if(dhActiveSort==='price_desc')deals.sort((a,b)=>b.final_deal_price-a.final_deal_price);
  else if(dhActiveSort==='newest')deals.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  else deals.sort((a,b)=>(a.deal_order||999)-(b.deal_order||999));
  return deals;
}

/* ── RENDER DEALS ── */
function dhRenderDeals(){
  dhAllIntervals.forEach(clearInterval);dhAllIntervals=[];
  const deals=dhGetFiltered();
  const el=document.getElementById('dhContent');el.innerHTML='';
  const header=document.getElementById('dhResultsHeader');
  const countEl=document.getElementById('dhResultsCount');
  if(deals.length>0){
    header.style.display='flex';
    const bStr=dhSelectedBrands.size>0?` · ${[...dhSelectedBrands].join(', ')}`:'' ;
    const cStr=dhActiveCat!=='all'?` in ${dhActiveCat}`:'';
    countEl.innerHTML=`<strong>${deals.length}</strong> deal${deals.length!==1?'s':''}${cStr}${bStr}`;
  }else{header.style.display='none';}
  if(!deals.length){
    el.innerHTML='<div class="dh-empty"><div class="dh-empty-icon">🔍</div><div class="dh-empty-title">No deals found</div><div>Try adjusting your filters</div></div>';
    return;
  }
  deals.forEach(deal=>el.appendChild(dhMakeCard(deal)));
}

function dhMakeCard(deal,small){
  const card=document.createElement('div');
  card.className='dh-deal-card'+((!deal.availability)?' oos':'');
  if(small)card.style.fontSize='12px';
  const imgs=dhGetImages(deal);
  const disc=Math.round(deal.discount_percent||0);
  const store=deal.ck_admin_stores||deal;
  const isRewards=(store.store_type||'')==='Rewards';
  const vc=dhViewingCount(deal.id);
  const finalPrice=Math.round(deal.final_deal_price||0);
  const mrp=Math.round(deal.mrp||0);
  const priceDrop=deal.price_dropped===true;
  let imgHtml=imgs[0]
    ?`<img class="dh-card-img" src="${imgs[0]}" loading="lazy" alt="${(deal.product_name||'').replace(/"/g,'')}" onerror="this.style.display='none'">`
    :`<div class="dh-card-placeholder">🛍</div>`;
  card.innerHTML=`
    <div class="dh-card-img-wrap">
      ${imgHtml}
      ${disc>0?`<div class="dh-card-disc-badge">${disc}% OFF</div>`:''}
      ${priceDrop?`<div class="dh-price-drop-ribbon">🔥 Price Drop</div>`:''}
      ${!deal.availability?'<div class="dh-card-oos-overlay">Out of Stock</div>':''}
      <div class="dh-card-viewing"><span class="dh-card-viewing-dot"></span><span>${vc} viewing</span></div>
    </div>
    <div class="dh-card-body">
      <div class="dh-card-retailer">${deal.report_storename||''}</div>
      <div class="dh-card-name">${deal.product_name||''}</div>
      <div class="dh-card-prices">
        <span class="dh-card-mrp">₹${dhFmt(mrp)}</span>
        <span class="dh-card-price">₹${dhFmt(finalPrice)}</span>
      </div>
      <div class="dh-card-footer">
        <div class="dh-card-timer"><span class="dh-card-timer-text">--:--:--</span></div>
        <span class="dh-type-badge ${isRewards?'dh-badge-rewards':'dh-badge-cashback'}">${isRewards?'Rewards':'Cashback'}</span>
      </div>
    </div>`;
  const timerEl=card.querySelector('.dh-card-timer-text');
  const updT=()=>{if(timerEl)timerEl.textContent=dhTimeLeft(deal.timer_hours,true);};
  updT();const tiv=setInterval(updT,1000);dhAllIntervals.push(tiv);
  card.onclick=()=>dhShowDetail(deal.id);
  return card;
}

/* ── SKELETONS ── */
function dhShowSkeletons(){

}
function dhHideSkeletons(){document.getElementById('dhSkeletons').innerHTML='';}

/* ── SEARCH ── */
let dhSearchTimeout;
document.getElementById('dhSearch').addEventListener('input',function(){
  clearTimeout(dhSearchTimeout);
  const q=this.value.trim();
  if(q.length>1){dhShowSuggestions(q);dhSearchTimeout=setTimeout(()=>{dhSearchQuery=q;dhRenderDeals();},200);}

});
document.addEventListener('click',e=>{if(!e.target.closest('.dh-search-wrap'))document.getElementById('dhSuggestions').style.display='none';});

function dhShowSuggestions(q){
  const ql=q.toLowerCase();
  const matches=DH_ALL.filter(d=>(d.product_name||'').toLowerCase().includes(ql)||(d.category||'').toLowerCase().includes(ql)).sort((a,b)=>(a.deal_order||999)-(b.deal_order||999)).slice(0,3);
  const el=document.getElementById('dhSuggestions');
  if(!matches.length){el.style.display='none';return;}
  el.innerHTML=matches.map(d=>{
    const imgs=dhGetImages(d);
    return `<div class="dh-sug-item" onclick="dhShowDetail('${d.id}')">
      <div class="dh-sug-img-wrap">${imgs[0]?`<img class="dh-sug-img" src="${imgs[0]}" onerror="this.style.display='none'">`:'🛍'}</div>
      <div class="dh-sug-info"><div class="dh-sug-name">${d.product_name||''}</div><div class="dh-sug-price">${d.report_storename} · ₹${dhFmt(d.final_deal_price)}</div></div>
      <span class="dh-sug-badge">${Math.round(d.discount_percent||0)}% OFF</span></div>`;
  }).join('');
  el.style.display='block';
}

document.getElementById('dhPriceMin').oninput=function(){dhPriceMin=this.value?Number(this.value):null;dhRenderDeals();};
document.getElementById('dhPriceMax').oninput=function(){dhPriceMax=this.value?Number(this.value):null;dhRenderDeals();};

/* ── DETAIL PAGE ── */
function dhShowDetail(dealId){
  const deal=DH_ALL.find(d=>d.id===dealId);
  if(!deal)return;
  window.location.hash='deal/'+dealId;
  window.scrollTo(0,0);
  dhRenderDetail(deal);
  document.getElementById('dhListingPage').style.display='none';
  document.getElementById('dhDetailPage').style.display='block';
  const fcta=document.getElementById('dhFloatingCta');
  if(fcta&&window.innerWidth<=900)fcta.style.display='block';
}
function dhShowListing(){
  window.location.hash='';
  dhAllIntervals.forEach(clearInterval);dhAllIntervals=[];
  document.getElementById('dhFloatingCta').style.display='none';
  document.getElementById('dhDetailPage').style.display='none';
  document.getElementById('dhListingPage').style.display='block';
}

function dhRenderDetail(deal){
  dhAllIntervals.forEach(clearInterval);dhAllIntervals=[];
  const imgs=dhGetImages(deal);
  const store=deal.ck_admin_stores||deal;
  const rates=dhParseArr(deal.retailer_rates);
  const isRewards=(store.store_type||'')==='Rewards';
  const vc=dhViewingCount(deal.id);
  const groupid=store.groupid||deal.groupid||'A';
  const isB1=groupid==='B1';
  const cbType=store.cashback_type==='percent'?'%':'₹';
  const cbWord=isRewards?'Rewards':'Cashback';
  let cb;
  if(isB1){cb=deal.b1_new_cashback??deal.cashback_override??store.cashback??0;}
  else if(groupid!=='A'){cb=deal.cashback_override??0;}
  else{cb=store.cashback??0;}
  const existingCb=isB1?(deal.b1_existing_cashback??null):null;

  /* GALLERY */
  const galleryEl=document.getElementById('dhGallery');
  let imgIdx=0,autoRotate,galleryHovered=false;
  const thumbsHtml=imgs.map((url,i)=>`<div class="dh-thumb${i===0?' active':''}" data-idx="${i}"><img src="${url}" loading="lazy" onerror="this.style.display='none'"></div>`).join('');
  galleryEl.innerHTML=`
    <div class="dh-gallery-main" id="dhGMain">
      ${imgs[0]?`<img id="dhGImg" src="${imgs[0]}" alt="${(deal.product_name||'').replace(/"/g,'')}" onerror="this.src=''">`:'<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:60px">🛍</div>'}
      <div class="dh-gallery-count" id="dhGCount">${imgs.length>1?'1/'+imgs.length:''}</div>
      <div class="dh-gallery-viewing"><span class="dh-gallery-dot"></span>${vc} viewing</div>
    </div>
    <div class="dh-thumbs" id="dhThumbs">${thumbsHtml}</div>`;

  function dhGoImg(i){
    imgIdx=i;
    const g=document.getElementById('dhGImg');
    if(g){g.classList.add('dh-fade');setTimeout(()=>{g.src=imgs[i];g.classList.remove('dh-fade');},250);}
    document.getElementById('dhGCount').textContent=imgs.length>1?(i+1)+'/'+imgs.length:'';
    document.querySelectorAll('.dh-thumb').forEach(t=>t.classList.toggle('active',+t.dataset.idx===i));
  }
  document.getElementById('dhThumbs').addEventListener('click',e=>{
    const t=e.target.closest('.dh-thumb');if(t){clearInterval(autoRotate);dhGoImg(+t.dataset.idx);}
  });
  document.getElementById('dhGMain').addEventListener('mouseenter',()=>galleryHovered=true);
  document.getElementById('dhGMain').addEventListener('mouseleave',()=>galleryHovered=false);
  if(imgs.length>1){autoRotate=setInterval(()=>{if(!galleryHovered)dhGoImg((imgIdx+1)%imgs.length);},DH_ROT_MS);dhAllIntervals.push(autoRotate);}

  /* WATERFALL */
  function dhCalcWf(cbVal){
    const cd=deal.coupon_type==='percent'?(deal.discounted_price*(deal.coupon_discount/100)):(deal.coupon_discount||0);
    const ac=deal.discounted_price-cd;
    const pdAmt=deal.prepaid_type_override==='percent'?ac*((deal.prepaid_discount_override||0)/100):(deal.prepaid_discount_override||0);
    const ap=ac-pdAmt;
    const sf=deal.shipping_fee_override??store.shipping_fee??0;
    const rule=deal.shipping_rule_override??store.shipping_rule??'yes';
    const cbBase=rule==='yes'?ap+sf:ap;
    const cbAmt=cbType==='%'?cbBase*(cbVal/100):cbVal;
    const pAfterCb=cbBase-cbAmt;
    const final=Math.round(rule==='no'?pAfterCb+sf:pAfterCb);
    const discPct=deal.mrp>0?Math.round((deal.mrp-final)/deal.mrp*100):0;
    return{cd,ac,pdAmt,ap,sf,rule,cbAmt,final,discPct,cbVal};
  }
  function dhBuildWfRows(w){
    let r=`<div class="dh-wf-row dh-wf-s"><span>MRP</span><span class="dh-wv">₹${dhFmt(deal.mrp)}</span></div>
<div class="dh-wf-row"><span>Discounted price</span><span class="dh-wv">₹${dhFmt(deal.discounted_price)}</span></div>`;
    if(w.cd>0)r+=`<div class="dh-wf-row dh-wf-d"><span>Coupon (${deal.coupon_code||''})</span><span class="dh-wv">−₹${dhFmt(w.cd)}</span></div>`;
    if(w.pdAmt>0)r+=`<div class="dh-wf-row dh-wf-d"><span>Prepaid discount</span><span class="dh-wv">−₹${dhFmt(w.pdAmt)}</span></div>`;
    if(w.sf>0)r+=`<div class="dh-wf-row dh-wf-a"><span>+ Shipping</span><span class="dh-wv">₹${dhFmt(w.sf)}</span></div>`;
    r+=`<div class="dh-wf-row dh-wf-d"><span>CashKaro ${w.cbVal}${cbType} ${cbWord}</span><span class="dh-wv">−₹${dhFmt(w.cbAmt)}</span></div>
<span class="dh-wf-divider"></span>
<div class="dh-wf-row dh-wf-tot"><span>Final deal price</span><span class="dh-wv">₹${dhFmt(w.final)}</span></div>
<div class="dh-wf-row dh-wf-sv"><span>🎉 You save ${w.discPct}% vs MRP</span></div>`;
    return r;
  }

  const wNew=dhCalcWf(cb);
  const wExisting=isB1&&existingCb!==null?dhCalcWf(existingCb):null;
  const disc=wNew.discPct;
  const mrpR=Math.round(deal.mrp||0);
  const finalR=Math.round(wNew.final);
  const priceDrop=deal.price_dropped===true;
  const storeType=store.store_type||'Cashback';
  const trackingSpeed=store.tracking_speed||'—';
  const confirmDays=store.expected_confirmation_days||'—';
  const trackNum=String(trackingSpeed).match(/\d+/)?.[0]||trackingSpeed;
  const trackUnit=String(trackingSpeed).replace(/\d+/,'').trim()||'';
  const dealUrl=window.location.href;
  const waMsg=encodeURIComponent(`🔥 Get ${deal.product_name} for just ₹${dhFmt(finalR)} (MRP ₹${dhFmt(mrpR)}) — ${disc}% off + ${cb}${cbType} CashKaro ${cbWord}. Grab it here: ${dealUrl}`);
  const trackingUrl=dhBuildTrackingUrl(store.linkurl,deal.product_url);
  const rawDesc=deal.description||'';
  const cleanDesc=rawDesc.replace(/₹\s*[\d,]+(\.\d+)?/g,`₹${dhFmt(finalR)}`).replace(/\b\d+(\.\d+)?%\s*off\b/gi,`${disc}% off`);
  const tc=(store.cashback_tc||'').replace(/<script[^>]*>[\s\S]*?<\/script>/gi,'');

  /* B1 TABS */
  const userTabsHtml=isB1&&wExisting?`<div class="dh-user-tabs" id="dhUserTabs">
    <button class="dh-user-tab active" id="dhTabNu" onclick="dhSwitchUserTab('new')">🆕 New to ${deal.report_storename}<span class="dh-utab-small">₹${dhFmt(Math.round(wNew.final))}</span></button>
    <button class="dh-user-tab" id="dhTabEu" onclick="dhSwitchUserTab('existing')">🔄 Existing User<span class="dh-utab-small">₹${dhFmt(Math.round(wExisting.final))}</span></button>
  </div>`:'';

  /* RATES */
  let ratesHtml='';
  if(rates.length){
    ratesHtml=`<div style="margin-bottom:8px;font-size:12px;color:#9898aa;font-weight:600">Multiple rates:</div>
<div class="dh-rates-head"><span class="dh-rates-col1">User type</span><span class="dh-rates-col2">Cashback</span></div>
${rates.map(r=>`<div class="dh-rates-row"><span class="dh-rates-col1">${r.rate_label}</span><span class="dh-rates-col2">${r.cashback}${r.cashback_type==='percent'?'%':'₹'}</span></div>`).join('')}`;
  }

  document.getElementById('dhDetailInfo').innerHTML=`
    <div class="dh-detail-retailer-row">
      <span class="dh-detail-retailer">${deal.report_storename||''}</span>
      <span class="dh-detail-cat-badge">${deal.category||''}</span>
      <span class="dh-type-badge ${isRewards?'dh-badge-rewards':'dh-badge-cashback'}">${storeType}</span>
      ${priceDrop?`<span style="background:#fef2f2;color:#e53e3e;font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;border:1px solid #fecaca">🔥 Price Dropped</span>`:''}
    </div>
    <div class="dh-detail-name">${deal.product_name||''}</div>
    <div class="dh-detail-viewing"><span class="dh-detail-viewing-dot"></span>${vc} people viewing</div>
    ${userTabsHtml}
    <div class="dh-price-block">
      <div class="dh-price-row">
        <span class="dh-detail-mrp">₹${dhFmt(mrpR)}</span>
        <span class="dh-detail-price" id="dhDpFinal">₹${dhFmt(finalR)}</span>
        <span class="dh-detail-disc-badge" id="dhDpDisc">${disc}% OFF</span>
      </div>
      <div class="dh-detail-timer">
        <span class="dh-detail-timer-label">⏱ Deal ends in</span>
        <span class="dh-detail-timer-val" id="dhDetailTimerVal">--:--:--</span>
      </div>
      <div class="dh-cb-line">+ Earn <strong>${cb}${cbType} ${cbWord}</strong> via CashKaro</div>
      <div class="dh-wf-toggle" onclick="var b=document.getElementById('dhWfBody');b.classList.toggle('open');this.querySelector('span:last-child').textContent=b.classList.contains('open')?'▴':'▾'">
        <span>💡 How is this price calculated?</span><span>▾</span>
      </div>
      <div class="dh-wf-body" id="dhWfBody">${dhBuildWfRows(wNew)}</div>
    </div>
    <div class="dh-inline-cta-wrap">
      <a class="dh-cta-btn" id="dhInlineBtn" href="${trackingUrl}" target="_blank" rel="noopener">🛍 Shop Now &amp; Earn ${cb}${cbType} ${cbWord}</a>
      <a class="dh-share-btn" href="https://wa.me/?text=${waMsg}" target="_blank" rel="noopener" style="margin-top:8px">💬 Share on WhatsApp</a>
      <div class="dh-cta-sub">Cashback tracked via CashKaro. Must shop through this link.</div>
    </div>
    <div class="dh-tabs-wrap">
      <div class="dh-tab-list">
        <button class="dh-tab-btn active" onclick="dhSwitchTab(this,'dhTabAbout')">About</button>
        <button class="dh-tab-btn" onclick="dhSwitchTab(this,'dhTabCbinfo')">${cbWord} Info</button>
        <button class="dh-tab-btn" onclick="dhSwitchTab(this,'dhTabTerms')">T&amp;Cs</button>
      </div>
      <div class="dh-tab-content active" id="dhTabAbout">${cleanDesc?cleanDesc.replace(/\n/g,'<br>'):'<span style="color:#9898aa">Description coming soon.</span>'}</div>
      <div class="dh-tab-content" id="dhTabCbinfo">
        <div class="dh-cb-chips">
          <div class="dh-cb-chip dh-green">
            <div class="dh-cb-chip-label">${cbWord} tracks in</div>
            <div class="dh-cb-chip-val">${trackNum}</div>
            <div class="dh-cb-chip-unit">${trackUnit}</div>
          </div>
          <div class="dh-cb-chip dh-green">
            <div class="dh-cb-chip-label">${cbWord} confirms in</div>
            <div class="dh-cb-chip-val">${confirmDays}</div>
            <div class="dh-cb-chip-unit">Days</div>
          </div>
          <div class="dh-cb-chip">
            <div class="dh-cb-chip-label">Type</div>
            <div class="dh-cb-chip-val" style="font-size:16px">${storeType}</div>
            <div class="dh-cb-chip-unit">${isRewards?'Store Credits':'Real Cash'}</div>
          </div>
        </div>
        ${ratesHtml}
      </div>
      <div class="dh-tab-content" id="dhTabTerms">${tc||'<span style="color:#9898aa">Standard CashKaro T&Cs apply.</span>'}</div>
    </div>`;

  /* FLOATING CTA */
  const fb=document.getElementById('dhFloatingBtn');
  if(fb){fb.href=trackingUrl;fb.textContent=`🛍 Shop Now & Earn ${cb}${cbType} ${cbWord}`;}

  /* TIMER */
  const updT=()=>{const el=document.getElementById('dhDetailTimerVal');if(el)el.textContent=dhTimeLeft(deal.timer_hours,true);else clearInterval(dtInt);};
  updT();const dtInt=setInterval(updT,1000);dhAllIntervals.push(dtInt);

  /* B1 USER TAB SWITCH */
  window.dhSwitchUserTab=function(type){
    document.getElementById('dhTabNu')?.classList.toggle('active',type==='new');
    document.getElementById('dhTabEu')?.classList.toggle('active',type==='existing');
    const w=type==='existing'&&wExisting?wExisting:wNew;
    const cbV=type==='existing'&&existingCb!==null?existingCb:cb;
    const url=dhBuildTrackingUrl(store.linkurl,deal.product_url);
    const ctaTxt=`🛍 Shop Now & Earn ${cbV}${cbType} ${cbWord}`;
    document.getElementById('dhDpFinal').textContent='₹'+dhFmt(Math.round(w.final));
    document.getElementById('dhDpDisc').textContent=w.discPct+'% OFF';
    document.getElementById('dhWfBody').innerHTML=dhBuildWfRows(w);
    const ib=document.getElementById('dhInlineBtn');if(ib){ib.href=url;ib.textContent=ctaTxt;}
    const flb=document.getElementById('dhFloatingBtn');if(flb){flb.href=url;flb.textContent=ctaTxt;}
  };

  /* SIMILAR */
  document.getElementById('dhDetailInner').querySelector('.dh-similar-section')?.remove();
  const similar=DH_ALL.filter(d=>d.id!==deal.id&&d.category===deal.category).slice(0,6);
  if(similar.length>0){
    const sec=document.createElement('div');sec.className='dh-similar-section';
    sec.innerHTML=`<div class="dh-similar-title"><span style="display:inline-block;width:4px;height:20px;background:#5c2be2;border-radius:2px"></span>Deals you may like</div><div class="dh-similar-grid" id="dhSimGrid"></div>`;
    document.getElementById('dhDetailInner').appendChild(sec);
    similar.forEach(d=>sec.querySelector('#dhSimGrid').appendChild(dhMakeCard(d,true)));
  }
}

function dhSwitchTab(btn,tabId){
  btn.closest('.dh-tabs-wrap').querySelectorAll('.dh-tab-btn').forEach(b=>b.classList.remove('active'));
  btn.closest('.dh-tabs-wrap').querySelectorAll('.dh-tab-content').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(tabId).classList.add('active');
}

/* ── HASH ROUTING ── */
function dhHandleHash(){
  const hash=window.location.hash.slice(1);
  if(hash.startsWith('deal/')){const id=hash.replace('deal/','');if(DH_ALL.length)dhShowDetail(id);else dhPendingId=id;}
  else dhShowListing();
}
window.addEventListener('hashchange',dhHandleHash);

/* ── BOOT ── */
function dhHideLoader(){var l=document.getElementById('dhLoader');if(l)l.style.display='none';}

(async()=>{
  dhShowSkeletons();
  document.getElementById('dhListingPage').style.display='block';
  /* Safety net: always hide loader after 10s regardless */
  var loaderKill=setTimeout(dhHideLoader,10000);
  try{await dhFetch();}catch(e){console.error('Boot error:',e);}
  clearTimeout(loaderKill);
  dhHideSkeletons();
  try{dhBuildSidebar();}catch(e){console.error('Sidebar error:',e);}
  try{dhRenderDeals();}catch(e){console.error('Render error:',e);}
  dhHideLoader();
  try{
    if(dhPendingId){dhShowDetail(dhPendingId);dhPendingId=null;}
    else dhHandleHash();
  }catch(e){console.error('Routing error:',e);}
})();
</script>
